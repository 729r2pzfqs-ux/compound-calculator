  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | CompoundCalc</title>
  <link rel="icon" href="/favicon.ico">
  <meta name="robots" content="noindex">
  <script>
  (function(){
    var p = window.location.pathname;
    var s = window.location.search;

    // Prevent redirect loops
    var lk='cc404_'+p;
    try{if(sessionStorage.getItem(lk)){sessionStorage.removeItem(lk);return;}sessionStorage.setItem(lk,'1');}catch(e){}

    // 1. Locale-prefixed pages → strip locale, redirect to English equivalent
    var localeMatch = p.match(/^\/(ar|de|es|fr|pt|zh|ja|hi|ru|tr)\//);
    if (localeMatch) {
      var rest = p.replace(/^\/(ar|de|es|fr|pt|zh|ja|hi|ru|tr)\//, '/');
      if (!rest || rest === '/') rest = '/';
      window.location.replace(rest + s);
      return;
    }

    // 2. Bare locale path /de, /es etc → home
    if (/^\/(ar|de|es|fr|pt|zh|ja|hi|ru|tr)\/?$/.test(p)) {
      window.location.replace('/');
      return;
    }

    // 3. Case normalization
    var lower = p.toLowerCase();
    if (p !== lower) {
      window.location.replace(lower + s);
      return;
    }

    // 4. Add trailing slash
    if (p.length > 1 && !p.match(/\.\w+$/) && !p.match(/\/$/)) {
      window.location.replace(p + '/' + s);
      return;
    }
  })();
  </script>

    a { color: var(--primary); text-decoration: none; font-weight: 600; }
